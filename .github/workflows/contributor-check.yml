name: Contributor Attribution Check

on:
  workflow_call:
    outputs:
      review_status:
        description: "JSON array of review status objects"
        value: ${{ jobs.check-attribution.outputs.review_status }}

permissions:
  contents: read

jobs:
  check-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      review_status: ${{ steps.check-emails.outputs.review_status }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0  # Full history needed for git log

      - name: Check for unmapped contributor emails
        id: check-emails
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Get the merge base between this PR and main
          MERGE_BASE=$(git merge-base origin/main HEAD)

          # Delegate only commits reachable from this cycle's pinned, verified official
          # merge parents. A fork commit sharing an official author's email still needs a map.
          NEW_EMAILS=$(python3 scripts/ci/official_import_authors.py "$MERGE_BASE" HEAD)

          if [ -z "$NEW_EMAILS" ]; then
            echo "No fork-authored emails to check; verified official imports retain their Git authors."
            echo "review_status=[]" >> "$GITHUB_OUTPUT"
            echo "review_status=[]" > review-status.json
            exit 0
          fi

          # An email is mapped if it has a file in contributors/emails/
          # (one file per email — conflict-free) or an entry in the frozen
          # legacy AUTHOR_MAP in scripts/releases/authors_legacy.py.
          MISSING=""
          while IFS= read -r email; do
            # Skip teknium and bot emails
            case "$email" in
              *teknium*|*noreply@github.com*|*dependabot*|*github-actions*|*anthropic.com*|*cursor.com*)
                continue ;;
            esac

            if echo "$email" | grep -qE '^[0-9]+\+[A-Za-z0-9-]+@users\.noreply\.github\.com$'; then
              continue  # GitHub id+login noreply emails auto-resolve
            fi

            if [ -f "contributors/emails/${email}" ]; then
              continue  # mapped via the contributors directory
            fi

            if ! python3 -c 'import sys; from scripts.releases.authors import AUTHOR_MAP, UNLINKED_AUTHOR_CREDITS; sys.exit(0 if sys.argv[1] in AUTHOR_MAP or sys.argv[1] in UNLINKED_AUTHOR_CREDITS else 1)' "$email"; then
              AUTHOR=$(git log --author="$email" --format='%an' -1)
              MISSING="${MISSING}\n  ${email} (${AUTHOR})"
            fi
          done <<< "$NEW_EMAILS"

          if [ -n "$MISSING" ]; then
            echo ""
            echo "⚠️  New contributor email(s) without a mapping:"
            echo -e "$MISSING"
            echo ""
            echo "Check each fork commit's linked GitHub author before adding an exact-email mapping."
            echo "Do not guess a login or bulk-run --fix for unverified identities."
            echo -e "$MISSING" | while read -r line; do
              email=$(echo "$line" | sed 's/^ *//' | cut -d' ' -f1)
              [ -z "$email" ] && continue
              echo "    python3 scripts/add_contributor.py ${email} <github-username>"
            done
            echo ""
            echo "Use the commit's author.login or original PR as identity evidence."

            # Emit review_status for unmapped emails
            DETAIL=$(echo -e "$MISSING" | sed '/^$/d; s/^  //')
            HOW_TO_FIX=$'Inspect the exact fork commit\x27s linked GitHub author or original PR, then add a reviewed exact-email mapping:\n```\npython3 scripts/add_contributor.py <email> <verified-github-login> <public-source>\n```\nIf no account can be verified, use the existing reviewed unlinked-credit path with the literal author name and original commit/PR source. Never guess a login or rewrite upstream history.'
            REVIEW_STATUS=$(jq -nc \
              --arg detail "$DETAIL" \
              --arg how_to_fix "$HOW_TO_FIX" \
              '[{"source":"contributor attribution","results":[{"kind":"action_required","title":"Unmapped contributor email(s)","summary":"New contributor email(s) are not in AUTHOR_MAP.","detail":$detail,"how_to_fix":$how_to_fix}]}]')
            echo "review_status=$REVIEW_STATUS" >> "$GITHUB_OUTPUT"
            echo "review_status=$REVIEW_STATUS" > review-status.json

            exit 1
          else
            echo "✅ All contributor emails are mapped."
            echo "review_status=[]" >> "$GITHUB_OUTPUT"
            echo "review_status=[]" > review-status.json
          fi

      - name: Upload review status artifact
        if: always() && steps.check-emails.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-status-contributor-check
          path: review-status.json
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore
